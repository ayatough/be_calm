[package]
name = "be_calm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Focus mode for Windows: allow up to three apps, block everything else, hide distractions"
default-run = "be_calm"

[dependencies]
be_calm_core = { path = "../be_calm_core" }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.36"
rfd = "0.17"
log.workspace = true
simplelog = "0.12"
directories.workspace = true
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
] }
